name: Android GLES build

on:
  push:
    branches: [android-gles-port]
  workflow_dispatch:

jobs:
  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl unzip xz-utils zip python3

      - name: Install Android NDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "ndk;28.2.13676358"

      - name: Vendor dependencies
        env:
          ZH_ANDROID: "1"
        run: bash GeneralsMD/Code/Tools/vendor.sh

      - name: Configure Android arm64
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
          cmake -S GeneralsMD/Code -B build-android -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-28             -DCMAKE_ANDROID_NDK="${ANDROID_NDK_HOME}"             -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build GLES renderer and native game
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          rm -f build.log build-exit-code.txt
          cmake --build build-android --target posixd3d9 generals -- -j2 -k 0 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "${status}" > build-exit-code.txt
          echo "Build exit code: ${status}"
          exit 0

      - name: Collect build error summary
        if: always()
        shell: bash
        run: |
          {
            echo "Android GLES build error summary"
            echo "================================"
            echo
            if [ -f build-exit-code.txt ]; then
              echo "Build exit code: $(cat build-exit-code.txt)"
            else
              echo "Build exit code: unknown"
            fi
            echo
            echo "Error count:"
            grep -Ec 'error:|FAILED:|undefined reference|incompatible with|linker command failed|ninja: build stopped' build.log 2>/dev/null || true
            echo
            echo "Relevant diagnostics:"
            grep -E 'error:|FAILED:|undefined reference|incompatible with|linker command failed|ninja: build stopped' build.log 2>/dev/null || true
          } > build-error-summary.txt

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-gles-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build error summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-gles-build-errors
          path: |
            build-error-summary.txt
            build-exit-code.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-gles-build-diagnostics
          path: |
            build-android/compile_commands.json
            build-android/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve build failure status
        if: always()
        shell: bash
        run: |
          status="$(cat build-exit-code.txt 2>/dev/null || printf '1')"
          case "${status}" in
            ''|*[!0-9]*) echo "Invalid build exit code: ${status}"; exit 1 ;;
          esac
          echo "Final build exit code: ${status}"
          exit "${status}"
