plugins {
    id "com.android.application"
}

android {
    namespace "org.reforged.zero.hour"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "org.reforged.zero.hour"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            manifest.srcFile "src/main/AndroidManifest.xml"
            java.srcDirs = [
                "src/main/java",
                "../../Code/Libraries/Source/SDL3/android-project/app/src/main/java"
            ]
            res.srcDirs = ["src/main/res"]
        }
    }

    externalNativeBuild {
        cmake {
            path "jni/CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
        }
        debug {
            debuggable true
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}
