plugins {
    id "com.android.application"
}

android {
    namespace "org.reforged.zero.hour"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        // Keep the same application id used by the first installable APK so upgrades stay in-place.
        applicationId "com.louay.generalszh"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "0.2.0-native-gles"

        if (!project.hasProperty("PREBUILT_NATIVE")) {
            externalNativeBuild {
                cmake {
                    arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_shared"
                }
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            manifest.srcFile "src/main/AndroidManifest.xml"
            java.srcDirs = [
                "src/main/java",
                "../../Code/Libraries/Source/SDL3/android-project/app/src/main/java"
            ]
            res.srcDirs = ["src/main/res"]
            // Reforged-owned data is part of the Android application, not the user's Steam install.
            // It is extracted once to private app storage before the native engine starts and mounted
            // as the normal POSIX overlay, leaving the original game files completely untouched.
            assets.srcDirs = ["../../../Code/Data"]
            jniLibs.srcDirs = ["libs"]
        }
    }

    if (!project.hasProperty("PREBUILT_NATIVE")) {
        externalNativeBuild {
            cmake {
                path "jni/CMakeLists.txt"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
        }
        debug {
            debuggable true
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}
